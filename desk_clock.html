<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>&#x200E;</title>
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAAElFTkSuQmCC">
<link rel="shortcut icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAAElFTkSuQmCC">
<style>
  /* ===== Reset & Base ===== */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    color-scheme: dark;
    /* Dark theme (default) */
    --bg: rgba(18, 18, 24, 0.88);
    --face: rgba(24, 24, 32, 0.92);
    --face-border: rgba(220, 220, 240, 0.35);
    --tick-major: rgba(220, 220, 240, 0.95);
    --tick-minor: rgba(220, 220, 240, 0.5);
    --hand-hour: rgba(220, 220, 240, 0.95);
    --hand-minute: rgba(220, 220, 240, 0.95);
    --hand-second: rgba(180, 180, 205, 0.7);
    --digital-color: rgba(220, 220, 240, 0.95);
    --digital-shadow: rgba(100, 100, 160, 0.25);
    --menu-bg: rgba(20, 20, 28, 0.96);
    --menu-text: #c0c0d8;
    --menu-hover: rgba(70, 70, 95, 0.4);
    --menu-border: rgba(80, 80, 110, 0.3);
    --menu-section: rgba(120, 120, 155, 0.6);
    --slider-track: rgba(70, 70, 95, 0.45);
    --slider-thumb: #656590;
    --brand-accent: #6366f1;
  }

  [data-theme="light"] {
    --bg: rgba(215, 215, 222, 0.88);
    --face: rgba(235, 235, 240, 0.92);
    --face-border: rgba(30, 30, 50, 0.35);
    --tick-major: rgba(30, 30, 50, 0.95);
    --tick-minor: rgba(30, 30, 50, 0.5);
    --hand-hour: rgba(30, 30, 50, 0.95);
    --hand-minute: rgba(30, 30, 50, 0.95);
    --hand-second: rgba(90, 70, 75, 0.65);
    --digital-color: rgba(30, 30, 50, 0.95);
    --digital-shadow: rgba(80, 80, 120, 0.15);
    --menu-bg: rgba(235, 235, 240, 0.97);
    --menu-text: #303045;
    --menu-hover: rgba(110, 110, 140, 0.15);
    --menu-border: rgba(140, 140, 165, 0.35);
    --menu-section: rgba(70, 70, 95, 0.6);
    --slider-track: rgba(140, 140, 170, 0.35);
    --slider-thumb: #555578;
    --brand-accent: #4f46e5;
  }

  [data-theme="blue"] {
    --bg: rgba(10, 14, 28, 0.9);
    --face: rgba(14, 20, 40, 0.92);
    --face-border: rgba(140, 190, 245, 0.35);
    --tick-major: rgba(140, 190, 245, 0.95);
    --tick-minor: rgba(140, 190, 245, 0.5);
    --hand-hour: rgba(140, 190, 245, 0.95);
    --hand-minute: rgba(140, 190, 245, 0.95);
    --hand-second: rgba(100, 150, 200, 0.7);
    --digital-color: rgba(140, 190, 245, 0.95);
    --digital-shadow: rgba(40, 100, 200, 0.25);
    --menu-bg: rgba(10, 16, 36, 0.97);
    --menu-text: #85aed8;
    --menu-hover: rgba(40, 75, 135, 0.35);
    --menu-border: rgba(50, 80, 135, 0.35);
    --menu-section: rgba(80, 125, 185, 0.6);
    --slider-track: rgba(40, 70, 120, 0.4);
    --slider-thumb: #3570b5;
    --brand-accent: #3b82f6;
  }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000000;
    font-family: 'Segoe UI', 'Yu Gothic UI', 'Meiryo', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }

  /* ===== Clock Container ===== */
  #clock-container {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  #clock-container:active {
    cursor: grabbing;
  }

  #clock-container.click-through {
    pointer-events: none !important;
  }

  /* Toast Notification */
  #toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 20, 28, 0.95);
    color: #e0e0f0;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 12px;
    border: 1px solid var(--face-border);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 20000;
  }
  #toast.show { opacity: 1; }

  #clock-container.analog-mode {
    width: min(90vw, 90vh);
    height: min(90vw, 90vh);
    min-width: 120px;
    min-height: 120px;
  }

  #clock-container.digital-mode {
    width: auto;
    height: auto;
    padding: 0;
  }

  /* ===== Analog Clock ===== */
  #analog-clock {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ===== Digital Clock ===== */
  #digital-clock {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    padding: 0;
    max-width: 98vw;
    max-height: 98vh;
  }

  #digital-time {
    font-size: 64px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--digital-color);
    text-shadow: 0 0 20px var(--digital-shadow);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    white-space: nowrap;
  }

  /* ===== Context Menu ===== */
  #context-menu {
    display: none;
    position: fixed;
    z-index: 10000;
    min-width: 220px;
    background: var(--menu-bg);
    border: 1px solid var(--menu-border);
    border-radius: 12px;
    padding: 6px 0;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.2);
    animation: menuFadeIn 0.15s ease-out;
    max-height: calc(100vh - 20px);
    overflow-y: auto;
  }

  @keyframes menuFadeIn {
    from { opacity: 0; transform: scale(0.95) translateY(-4px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px;
    color: var(--menu-text);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.12s;
    white-space: nowrap;
  }

  .menu-item:hover {
    background: var(--menu-hover);
  }

  .menu-item.active::after {
    content: '\2713';
    margin-left: auto;
    color: var(--brand-accent);
    font-weight: 600;
  }

  .menu-separator {
    height: 1px;
    background: var(--menu-border);
    margin: 4px 12px;
  }

  .menu-section-label {
    padding: 6px 16px 3px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--menu-section);
  }

  /* Theme color dots */
  .theme-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid transparent;
    flex-shrink: 0;
  }

  .theme-dot.dark { background: #1e1e2a; border-color: rgba(200,200,240,0.3); }
  .theme-dot.light { background: #f0f0f8; border-color: rgba(100,100,150,0.3); }
  .theme-dot.blue { background: #102040; border-color: rgba(60,130,220,0.4); }

  /* Slider in menu */
  .menu-slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
  }

  .menu-slider-row label {
    font-size: 12px;
    color: var(--menu-text);
    min-width: 68px;
  }

  .menu-slider-row input[type="range"] {
    flex: 1;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--slider-track);
    border-radius: 2px;
    outline: none;
  }

  .menu-slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    background: var(--slider-thumb);
    border-radius: 50%;
    cursor: pointer;
    border: none;
  }

  .menu-slider-row input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    background: var(--slider-thumb);
    border-radius: 50%;
    cursor: pointer;
    border: none;
  }

  .menu-slider-row .slider-value {
    font-size: 12px;
    color: var(--menu-section);
    min-width: 32px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<div id="clock-container" class="analog-mode">
  <canvas id="analog-clock"></canvas>
  <div id="digital-clock">
    <div id="digital-time">00:00</div>
  </div>
</div>

<!-- Toast Notification -->
<div id="toast"></div>

<!-- Context Menu -->
<div id="context-menu">
  <div class="menu-section-label">表示モード</div>
  <div class="menu-item active" data-action="mode-analog">&#128336; アナログ</div>
  <div class="menu-item" data-action="mode-digital">&#128290; デジタル</div>
  <div class="menu-separator"></div>
  <div class="menu-section-label">表示設定</div>
  <div class="menu-item" data-action="toggle-seconds">&#9202; 秒針を表示</div>
  <div class="menu-item" data-action="toggle-smart-opacity">&#128065; スマート透過 (マウス連動)</div>
  <div class="menu-item" data-action="toggle-click-through">&#128070; クリックすり抜け (Ctrl+Shift+X)</div>
  <div class="menu-separator"></div>
  <!-- Analog Specific Settings -->
  <div id="analog-settings-group">
    <div class="menu-section-label">針の設定</div>
    <div class="menu-slider-row">
      <label>時針 太さ</label>
      <input type="range" id="hour-width-slider" min="1" max="8" step="0.5" value="2.5">
      <span class="slider-value" id="hour-width-val">2.5px</span>
    </div>
    <div class="menu-slider-row">
      <label>時針 長さ</label>
      <input type="range" id="hour-len-slider" min="20" max="70" step="5" value="45">
      <span class="slider-value" id="hour-len-val">45%</span>
    </div>
    <div class="menu-slider-row">
      <label>分針 太さ</label>
      <input type="range" id="min-width-slider" min="1" max="8" step="0.5" value="2.5">
      <span class="slider-value" id="min-width-val">2.5px</span>
    </div>
    <div class="menu-slider-row">
      <label>分針 長さ</label>
      <input type="range" id="min-len-slider" min="30" max="90" step="5" value="82">
      <span class="slider-value" id="min-len-val">82%</span>
    </div>
    <div class="menu-slider-row">
      <label>秒針 太さ</label>
      <input type="range" id="sec-width-slider" min="0.5" max="5" step="0.5" value="1.5">
      <span class="slider-value" id="sec-width-val">1.5px</span>
    </div>
    <div class="menu-slider-row">
      <label>秒針 長さ</label>
      <input type="range" id="sec-len-slider" min="30" max="95" step="5" value="72">
      <span class="slider-value" id="sec-len-val">72%</span>
    </div>
    <div class="menu-separator"></div>
  </div>
  <!-- Digital Specific Settings -->
  <div id="digital-settings-group" style="display:none;">
    <div class="menu-section-label">デジタル設定</div>
    <div class="menu-slider-row">
      <label>文字サイズ</label>
      <input type="range" id="digital-size-slider" min="28" max="140" step="4" value="64">
      <span class="slider-value" id="digital-size-val">64px</span>
    </div>
    <div class="menu-separator"></div>
  </div>
  <div class="menu-section-label">カラーテーマ</div>
  <div class="menu-item active" data-action="theme-dark"><span class="theme-dot dark"></span>ダーク</div>
  <div class="menu-item" data-action="theme-light"><span class="theme-dot light"></span>ライト</div>
  <div class="menu-item" data-action="theme-blue"><span class="theme-dot blue"></span>ブルー</div>
  <div class="menu-separator"></div>
  <div class="menu-section-label">透明度</div>
  <div class="menu-slider-row">
    <label>透明度</label>
    <input type="range" id="opacity-slider" min="30" max="100" value="85">
    <span class="slider-value" id="opacity-value">85%</span>
  </div>
  <div class="menu-separator"></div>
  <div class="menu-item" data-action="reset">&#128260; 設定リセット</div>
</div>

<script>
(function() {
  'use strict';

  // ===== 設定管理 =====
  var STORAGE_KEY = 'desk_clock_settings';

  // 各プロパティの型定義（loadState のパース用）
  var PROP_TYPES = {
    mode: 'string', theme: 'string',
    opacity: 'int', showSeconds: 'bool', smartOpacity: 'bool', clickThrough: 'bool',
    hourWidth: 'float', hourLength: 'int', minuteWidth: 'float', minuteLength: 'int',
    secondWidth: 'float', secondLength: 'int', digitalSize: 'int',
    posX: 'float', posY: 'float'
  };

  var defaults = {
    mode: 'analog',
    theme: 'dark',
    opacity: 85,
    showSeconds: false,
    hourWidth: 4.0,
    hourLength: 45,
    minuteWidth: 4.0,
    minuteLength: 82,
    secondWidth: 1.5,
    secondLength: 72,
    digitalSize: 64,
    smartOpacity: false,
    clickThrough: false,
    posX: 0,
    posY: 0
  };
  var state = {};

  function loadState() {
    state = Object.assign({}, defaults);
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return;
      var parsed = JSON.parse(saved);
      for (var key in PROP_TYPES) {
        if (parsed[key] == null) continue;
        var type = PROP_TYPES[key];
        if (type === 'string') state[key] = String(parsed[key]);
        else if (type === 'int') state[key] = parseInt(parsed[key]);
        else if (type === 'float') state[key] = parseFloat(parsed[key]);
        else if (type === 'bool') state[key] = !!parsed[key];
      }
    } catch(e) {}
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }

  // ===== DOM =====
  var container = document.getElementById('clock-container');
  var canvas = document.getElementById('analog-clock');
  var ctx = canvas.getContext('2d');
  var digitalClock = document.getElementById('digital-clock');
  var digitalTime = document.getElementById('digital-time');
  var menu = document.getElementById('context-menu');
  var opacitySlider = document.getElementById('opacity-slider');
  var opacityValue = document.getElementById('opacity-value');
  var analogGroup = document.getElementById('analog-settings-group');
  var digitalGroup = document.getElementById('digital-settings-group');
  var hourWidthSlider = document.getElementById('hour-width-slider');
  var hourWidthVal = document.getElementById('hour-width-val');
  var hourLenSlider = document.getElementById('hour-len-slider');
  var hourLenVal = document.getElementById('hour-len-val');
  var minWidthSlider = document.getElementById('min-width-slider');
  var minWidthVal = document.getElementById('min-width-val');
  var minLenSlider = document.getElementById('min-len-slider');
  var minLenVal = document.getElementById('min-len-val');
  var secWidthSlider = document.getElementById('sec-width-slider');
  var secWidthVal = document.getElementById('sec-width-val');
  var secLenSlider = document.getElementById('sec-len-slider');
  var secLenVal = document.getElementById('sec-len-val');
  var digitalSizeSlider = document.getElementById('digital-size-slider');
  var digitalSizeVal = document.getElementById('digital-size-val');

  // ===== テーマ・UI同期 =====
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', state.theme);
    opacitySlider.value = state.opacity;
    opacityValue.textContent = state.opacity + '%';

    // Update hand sliders UI
    hourWidthSlider.value = state.hourWidth;
    hourWidthVal.textContent = state.hourWidth + 'px';
    hourLenSlider.value = state.hourLength;
    hourLenVal.textContent = state.hourLength + '%';
    minWidthSlider.value = state.minuteWidth;
    minWidthVal.textContent = state.minuteWidth + 'px';
    minLenSlider.value = state.minuteLength;
    minLenVal.textContent = state.minuteLength + '%';
    secWidthSlider.value = state.secondWidth;
    secWidthVal.textContent = state.secondWidth + 'px';
    secLenSlider.value = state.secondLength;
    secLenVal.textContent = state.secondLength + '%';
    digitalSizeSlider.value = state.digitalSize;
    digitalSizeVal.textContent = state.digitalSize + 'px';
    digitalTime.style.fontSize = state.digitalSize + 'px';

    // Toggle menu group visibility by mode
    if (state.mode === 'analog') {
      analogGroup.style.display = 'block';
      digitalGroup.style.display = 'none';
    } else {
      analogGroup.style.display = 'none';
      digitalGroup.style.display = 'block';
    }

    // Update menu active states
    var themeItems = menu.querySelectorAll('[data-action^="theme-"]');
    for (var i = 0; i < themeItems.length; i++) {
      var el = themeItems[i];
      if (el.dataset.action === 'theme-' + state.theme) {
        el.classList.add('active');
      } else {
        el.classList.remove('active');
      }
    }
    var modeItems = menu.querySelectorAll('[data-action^="mode-"]');
    for (var j = 0; j < modeItems.length; j++) {
      var el2 = modeItems[j];
      if (el2.dataset.action === 'mode-' + state.mode) {
        el2.classList.add('active');
      } else {
        el2.classList.remove('active');
      }
    }
    // Update toggles in menu
    var secToggle = menu.querySelector('[data-action="toggle-seconds"]');
    if (secToggle) {
      if (state.showSeconds) secToggle.classList.add('active'); else secToggle.classList.remove('active');
    }
    var smartToggle = menu.querySelector('[data-action="toggle-smart-opacity"]');
    if (smartToggle) {
      if (state.smartOpacity) smartToggle.classList.add('active'); else smartToggle.classList.remove('active');
    }
    var ctToggle = menu.querySelector('[data-action="toggle-click-through"]');
    if (ctToggle) {
      if (state.clickThrough) ctToggle.classList.add('active'); else ctToggle.classList.remove('active');
    }
  }

  // ===== 透明度・クリック透過 =====
  function applyOpacity() {
    if (state.smartOpacity) {
      container.style.opacity = (state.opacity / 100) * 0.45;
    } else {
      container.style.opacity = state.opacity / 100;
    }
  }

  function applyClickThrough() {
    if (state.clickThrough) {
      container.classList.add('click-through');
      showToast('クリックすり抜け有効 (解除: Ctrl+Shift+X)');
    } else {
      container.classList.remove('click-through');
    }
  }

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toastEl.classList.remove('show'); }, 3000);
  }

  // ===== 位置管理 =====
  function updatePosition() {
    container.style.transform = 'translate(calc(-50% + ' + state.posX + 'px), calc(-50% + ' + state.posY + 'px))';
  }

  function updateDigitalSize() {
    // Proportional to viewport max size
    var baseFontSize = Math.min(window.innerWidth * 0.32, window.innerHeight * 0.45);
    var scale = (state.digitalSize || 64) / 64;
    var fontSize = Math.max(20, Math.round(baseFontSize * scale));
    digitalTime.style.fontSize = fontSize + 'px';
  }

  function applyMode() {
    // classList で安全にモードクラスを切り替え（click-through 等を保持）
    container.classList.remove('analog-mode', 'digital-mode');
    if (state.mode === 'analog') {
      container.classList.add('analog-mode');
      canvas.style.display = 'block';
      digitalClock.style.display = 'none';
      resizeCanvas();
    } else {
      container.classList.add('digital-mode');
      container.style.width = 'auto';
      container.style.height = 'auto';
      canvas.style.display = 'none';
      digitalClock.style.display = 'flex';
      updateDigitalSize();
      updateDigital();
    }
    applyTheme();
    updatePosition();
  }

  // ===== キャンバスリサイズ =====
  function resizeCanvas() {
    if (state.mode !== 'analog') return;
    var size = Math.max(80, Math.min(window.innerWidth, window.innerHeight) * 0.98);
    var dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    container.style.width = size + 'px';
    container.style.height = size + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawAnalog();
  }

  // ===== アナログ時計描画 =====
  var computedStyle = null;
  function getColor(varName) {
    if (!computedStyle) computedStyle = getComputedStyle(document.documentElement);
    return computedStyle.getPropertyValue(varName).trim();
  }

  function drawAnalog() {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.width / dpr;
    var h = canvas.height / dpr;
    var cx = w / 2;
    var cy = h / 2;
    var r = Math.min(cx, cy) - 4;
    var now = new Date();
    var hours = now.getHours();
    var minutes = now.getMinutes();
    var seconds = now.getSeconds();

    ctx.clearRect(0, 0, w, h);

    // テーマカラー取得
    computedStyle = null; // テーマ変更時に再取得
    var cFace = getColor('--face');
    var cBorder = getColor('--face-border');
    var cTickMajor = getColor('--tick-major');
    var cTickMinor = getColor('--tick-minor');
    var cHandHour = getColor('--hand-hour');
    var cHandMin = getColor('--hand-minute');
    var cHandSec = getColor('--hand-second');

    // Face background
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = cFace;
    ctx.fill();

    // Face border
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = cBorder;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Inner ring
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.92, 0, Math.PI * 2);
    ctx.strokeStyle = cBorder;
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // Tick marks
    for (var i = 0; i < 60; i++) {
      var angle = (i * 6 - 90) * Math.PI / 180;
      var isMajor = i % 5 === 0;
      var outerR = r * 0.92;
      var innerR = isMajor ? r * 0.82 : r * 0.87;
      var cos = Math.cos(angle);
      var sin = Math.sin(angle);

      ctx.beginPath();
      ctx.moveTo(cx + outerR * cos, cy + outerR * sin);
      ctx.lineTo(cx + innerR * cos, cy + innerR * sin);
      ctx.strokeStyle = isMajor ? cTickMajor : cTickMinor;
      ctx.lineWidth = isMajor ? 3.5 : 1.8;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // Hour hand
    var hourAngle = ((hours % 12) * 30 + minutes * 0.5 - 90) * Math.PI / 180;
    var hLen = r * (state.hourLength / 100);
    drawHand(cx, cy, hourAngle, hLen, state.hourWidth, cHandHour);

    // Minute hand
    var minAngle = (minutes * 6 + seconds * 0.1 - 90) * Math.PI / 180;
    var mLen = r * (state.minuteLength / 100);
    drawHand(cx, cy, minAngle, mLen, state.minuteWidth, cHandMin);

    // Second hand (conditional)
    if (state.showSeconds) {
      var secAngle = (seconds * 6 - 90) * Math.PI / 180;
      var sLen = r * (state.secondLength / 100);
      drawHand(cx, cy, secAngle, sLen, state.secondWidth, cHandSec);

      // Counterweight for second hand
      var counterAngle = secAngle + Math.PI;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + r * 0.15 * Math.cos(counterAngle), cy + r * 0.15 * Math.sin(counterAngle));
      ctx.strokeStyle = cHandSec;
      ctx.lineWidth = state.secondWidth;
      ctx.lineCap = 'round';
      ctx.stroke();
    }
  }

  function drawHand(cx, cy, angle, length, width, color) {
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + length * Math.cos(angle), cy + length * Math.sin(angle));
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // ===== デジタル時計 =====
  function updateDigital() {
    var now = new Date();
    var h = String(now.getHours()).padStart(2, '0');
    var m = String(now.getMinutes()).padStart(2, '0');
    digitalTime.textContent = h + ':' + m;
  }

  // ===== 毎秒更新 =====
  function tick() {
    if (state.mode === 'analog') {
      drawAnalog();
    } else {
      updateDigital();
    }
  }

  // ===== コンテキストメニュー =====
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    // 一旦表示してサイズを測定
    menu.style.display = 'block';
    menu.style.left = '0px';
    menu.style.top = '0px';
    var menuW = menu.offsetWidth || 220;
    var menuH = menu.offsetHeight || 300;
    // 画面端からはみ出さないよう位置調整
    var x = Math.max(10, Math.min(e.clientX, window.innerWidth - menuW - 10));
    var y = Math.max(10, Math.min(e.clientY, window.innerHeight - menuH - 10));
    menu.style.left = x + 'px';
    menu.style.top = y + 'px';
  });

  // Double click anywhere on clock to quickly toggle mode
  container.addEventListener('dblclick', function(e) {
    if (e.target.closest('#context-menu')) return;
    state.mode = (state.mode === 'analog') ? 'digital' : 'analog';
    applyMode();
    saveState();
    tick();
  });

  document.addEventListener('click', function(e) {
    if (!menu.contains(e.target)) {
      menu.style.display = 'none';
    }
  });

  menu.addEventListener('click', function(e) {
    var item = e.target.closest('.menu-item');
    if (!item) return;
    var action = item.dataset.action;
    if (!action) return;

    if (action === 'mode-analog') {
      state.mode = 'analog';
      applyMode();
    } else if (action === 'mode-digital') {
      state.mode = 'digital';
      applyMode();
    } else if (action === 'toggle-seconds') {
      state.showSeconds = !state.showSeconds;
      applyTheme();
    } else if (action === 'toggle-smart-opacity') {
      state.smartOpacity = !state.smartOpacity;
      applyOpacity();
      applyTheme();
    } else if (action === 'toggle-click-through') {
      state.clickThrough = !state.clickThrough;
      applyClickThrough();
      applyTheme();
    } else if (action.indexOf('theme-') === 0) {
      state.theme = action.replace('theme-', '');
      applyTheme();
    } else if (action === 'reset') {
      state = Object.assign({}, defaults);
      applyMode();
      applyOpacity();
      applyClickThrough();
    }

    saveState();
    tick();

    setTimeout(function() { menu.style.display = 'none'; }, 120);
  });

  // ===== スライダー =====
  function bindSlider(slider, valEl, unit, stateKey, onChange) {
    var isFloat = slider.step && slider.step.indexOf('.') !== -1;
    slider.addEventListener('input', function() {
      state[stateKey] = isFloat ? parseFloat(this.value) : parseInt(this.value);
      valEl.textContent = this.value + unit;
      if (onChange) onChange();
      saveState();
    });
    // メニュー閉じ防止
    slider.addEventListener('mousedown', function(e) { e.stopPropagation(); });
  }

  bindSlider(opacitySlider, opacityValue, '%', 'opacity', function() {
    applyOpacity();
  });

  bindSlider(hourWidthSlider, hourWidthVal, 'px', 'hourWidth', function() {
    if (state.mode === 'analog') drawAnalog();
  });

  bindSlider(hourLenSlider, hourLenVal, '%', 'hourLength', function() {
    if (state.mode === 'analog') drawAnalog();
  });

  bindSlider(minWidthSlider, minWidthVal, 'px', 'minuteWidth', function() {
    if (state.mode === 'analog') drawAnalog();
  });

  bindSlider(minLenSlider, minLenVal, '%', 'minuteLength', function() {
    if (state.mode === 'analog') drawAnalog();
  });

  bindSlider(secWidthSlider, secWidthVal, 'px', 'secondWidth', function() {
    if (state.mode === 'analog') drawAnalog();
  });

  bindSlider(secLenSlider, secLenVal, '%', 'secondLength', function() {
    if (state.mode === 'analog') drawAnalog();
  });

  bindSlider(digitalSizeSlider, digitalSizeVal, 'px', 'digitalSize', function() {
    updateDigitalSize();
  });

  // ===== ドラッグ移動 =====
  var isDragging = false;
  var dragStartX, dragStartY, initialPosX, initialPosY;

  container.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    if (e.target.closest('#context-menu')) return;
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    initialPosX = state.posX || 0;
    initialPosY = state.posY || 0;
    e.preventDefault();
  });

  document.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    var dx = e.clientX - dragStartX;
    var dy = e.clientY - dragStartY;
    state.posX = initialPosX + dx;
    state.posY = initialPosY + dy;
    updatePosition();
  });

  document.addEventListener('mouseup', function() {
    if (isDragging) {
      isDragging = false;
      saveState();
    }
  });

  // ===== ウィンドウリサイズ =====
  window.addEventListener('resize', function() {
    if (state.mode === 'analog') {
      resizeCanvas();
    } else {
      updateDigitalSize();
    }
  });

  // ===== スマート透過（マウスホバー連動） =====
  container.addEventListener('mouseenter', function() {
    if (state.smartOpacity) {
      container.style.opacity = '1.0';
    }
  });

  container.addEventListener('mouseleave', function() {
    if (state.smartOpacity) {
      applyOpacity();
    }
  });

  // ===== キーボードショートカット =====
  window.addEventListener('keydown', function(e) {
    // Ctrl + Shift + X: クリックすり抜けトグル
    if (e.ctrlKey && e.shiftKey && (e.key === 'X' || e.key === 'x')) {
      state.clickThrough = !state.clickThrough;
      applyClickThrough();
      applyTheme();
      saveState();
    }
  });

  // ===== 初期化 =====
  document.title = '\u200E';
  loadState();
  applyMode();
  applyOpacity();
  applyClickThrough();
  updatePosition();
  tick();
  setInterval(tick, 1000);

})();
</script>
</body>
</html>
